name: Fetch merch photos
on:
  push:
    paths: [".github/fetch-photos.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download listed photos from the site
        run: |
          mkdir -p print-files/photos
          while read -r name; do
            [ -z "$name" ] && continue
            curl -fsSL "https://aetheratelierco.com/m/$name" -o "print-files/photos/$name" || echo "missing $name"
          done < .github/fetch-photos.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add print-files/photos
          git diff --cached --quiet || git commit -m "Add merch product photos"
          git push
